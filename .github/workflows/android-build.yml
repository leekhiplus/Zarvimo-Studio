name: Build Android APK

# یہ ورک فلو ریپو میں موجود ZIP فائل خود ہی کھولتا ہے (آپ کو ایکسٹریکٹ نہیں کرنا)،
# اس کے اندر اینڈرائیڈ پروجیکٹ ڈھونڈتا ہے اور APK بناتا ہے۔
# This workflow unpacks any .zip in the repo by itself, finds the Android
# project inside and builds the APK. If the project is already unpacked in the
# repo root, it builds that directly.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project (unzip automatically if needed)
        run: |
          set -euo pipefail

          is_project() { [ -f "$1/settings.gradle.kts" -o -f "$1/settings.gradle" ] && [ -d "$1/app" ]; }

          find_project_in() {
            # look for the Gradle project root up to 3 levels deep
            find "$1" -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/node_modules/*' -not -path '*/.git/*' 2>/dev/null | sort | while read -r s; do
              d="$(dirname "$s")"
              if [ -d "$d/app" ]; then echo "$d"; break; fi
            done
          }

          PROJECT_DIR=""

          if is_project "."; then
            echo "Project already unpacked in repository root."
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            echo "Project not found in root. Looking for .zip files..."
            mapfile -t ZIPS < <(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' | sort)
            echo "Found ${#ZIPS[@]} zip file(s)"
            i=0
            for z in "${ZIPS[@]}"; do
              i=$((i+1))
              dest="$RUNNER_TEMP/unzipped/$i"
              mkdir -p "$dest"
              echo "--- Unzipping: $z"
              if ! unzip -q -o "$z" -d "$dest"; then
                echo "::warning::Could not unzip $z, skipping"
                continue
              fi
              found="$(find_project_in "$dest" | head -n1)"
              if [ -n "$found" ]; then
                PROJECT_DIR="$found"
                echo "Android project found in: $z"
                break
              fi
            done
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Android project found. Upload the project .zip (containing settings.gradle.kts and an app/ folder) to the repository root."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "=== Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7 (no gradlew / wrapper jar needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK
        run: |
          set -u
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > "$PROJECT_DIR/local.properties"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi

      - name: Unit tests (non-blocking)
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' | head -n1)"
          [ -n "$APK" ] || { echo "::error::APK not produced"; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/apk-out/Zafronix-Video-Editor-debug.apk"
          ls -lah "$GITHUB_WORKSPACE/apk-out"

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Zafronix-Video-Editor-debug-apk
          path: apk-out/Zafronix-Video-Editor-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as GitHub Release (direct download)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Zafronix Video Editor build ${{ github.run_number }}
          body: Debug APK built automatically. Download the .apk below and install it on your phone.
          files: apk-out/Zafronix-Video-Editor-debug.apk
